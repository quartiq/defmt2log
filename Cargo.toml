[package]
name = "defmt2log"
version = "0.2.1"
description = "Adapt full defmt logging to ordinary log records"
authors = ["Robert Jördens <rj@quartiq.de>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/quartiq/defmt2log"
edition = "2024"
readme = "README.md"

[dependencies]
defmt = "1.2.0"
defmt-decoder = "1.2.0"
defmt-parser = "1.1.0"
log = "0.4"

[dev-dependencies]
env_logger = "0.11"

[patch.crates-io]
defmt = { git = "https://github.com/knurling-rs/defmt.git", version = "=1.2.0" }
defmt-decoder = { git = "https://github.com/knurling-rs/defmt.git" }
defmt-parser = { git = "https://github.com/knurling-rs/defmt.git" }
